# vim:ft=kitty

## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #cdd6f4
background              #000
selection_foreground    #1e1e2e
selection_background    #f5e0dc
# Define differences between active windows and others
inactive_text_alpha 0.4
dim_opacity 0.5

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# Scrollbar colors
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #222222
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #fe7798  # git branch info
color9 #ff99a8  # quotes

# green
color2  #AFE
color10 #2FA

# yellow
color3  #e9facf
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

# Font settings
font_family family="JetBrainsMono Nerd Font" style=Light
bold_font family="JetBrainsMono Nerd Font" style=Medium
italic_font auto
bold_italic_font auto
font_size 14
font_features JetBrainsMonoNerd +liga +calt

# Cursor customization
cursor #2FA
cursor_text_color #000
cursor_shape underline
cursor_blink_interval 0.2
# Cursor snail trail
cursor_trail 1
cursor_trail_decay 0.05 0.1
cursor_start_threshold 1
cursor_trail_color #ABE

# Window
# hide_window_decorations titlebar-only

# Theme
include current-theme.conf


map f6 launch --allow-remote-control kitty +kitten broadcast


allow_remote_control yes
